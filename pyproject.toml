[project]
name = "renpy-relations"
version = "0.1.0"
description = "An experiment in relational facts and compiled Logica rules for Ren'Py"
requires-python = ">=3.11,<3.15"
dependencies = ["SQLAlchemy==2.0.43"]

[dependency-groups]
dev = ["logica==1.3.1415926535897", "pytest>=8,<10"]
renpy-linux = ["pysqlite3-binary==0.5.4.post2; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
