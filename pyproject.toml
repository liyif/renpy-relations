[project]
name = "renpy-relations"
version = "0.3.0"
description = "Embedded relational facts and compiled Logica rules for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.11,<3.15"
dependencies = ["SQLAlchemy==2.0.43"]

[project.optional-dependencies]
compiler = ["logica==1.3.1415926535897"]
duckdb = [
    "duckdb==1.5.6",
    "duckdb-engine==0.17.0",
]

[dependency-groups]
assets = [
    "fonttools>=4.60,<5",
]
dev = ["logica==1.3.1415926535897", "pytest>=8,<10"]
renpy-linux = ["pysqlite3-binary==0.5.4.post2; sys_platform == 'linux' and platform_machine == 'x86_64'"]

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project.scripts]
renpy-relations-compile = "relation_rules.compiler:main"

[tool.setuptools]
packages = ["relation_rules"]
py-modules = ["renpy_relations", "compile_rules"]
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
