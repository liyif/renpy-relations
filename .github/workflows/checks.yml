name: Checks and release candidates

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_VERSION: "0.11.18"
  SDK_SHA256: eb0a9be7f0fb13632fe25ceade9a8bed5a1b4d6b6e83bd19eeeb29e1a1bb4a45

jobs:
  python-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install package test dependencies without a game SDK
        run: uv sync --locked --extra duckdb
      - name: Check isolated wheel and source distribution installations
        run: uv run --locked --extra duckdb pytest -q tests/test_distribution.py
      - name: Build Python distribution
        run: uv build --out-dir dist/python

  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install test dependencies
        run: uv sync --locked --extra duckdb --group renpy-linux --group assets
      - name: Test both backends and all query modes
        run: uv run --locked --extra duckdb --group renpy-linux --group assets pytest -q
      - name: Install virtual display
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1 libegl1
      - name: Download pinned SDK and check its hash
        run: |
          curl --fail --location --retry 3 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2 --output "$RUNNER_TEMP/renpy-sdk.tar.bz2"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/renpy-sdk.tar.bz2" | sha256sum --check
          tar -xf "$RUNNER_TEMP/renpy-sdk.tar.bz2" -C "$RUNNER_TEMP"
      - name: Test fresh standalone projects
        run: |
          for game in palace tidelight; do
            uv run --locked --extra duckdb python -m tools.prepare_game --game "examples/$game" --out "$RUNNER_TEMP/$game" --backend duckdb --sdk "$RUNNER_TEMP/renpy-8.5.3-sdk"
            for backend in sqlite duckdb; do
              uv run --locked --extra duckdb python -m tools.check_renpy --sdk "$RUNNER_TEMP/renpy-8.5.3-sdk" --game "$RUNNER_TEMP/$game" --headless --backend "$backend" --timeout 180
            done
          done

  release-candidate:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: [checks, python-package]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - name: Install build dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth libgl1 libegl1
          uv sync --locked --extra duckdb --group renpy-linux --group assets
      - name: Download verified SDK
        run: |
          curl --fail --location --retry 3 https://www.renpy.org/dl/8.5.3/renpy-8.5.3-sdk.tar.bz2 --output "$RUNNER_TEMP/renpy-sdk.tar.bz2"
          printf '%s  %s\n' "$SDK_SHA256" "$RUNNER_TEMP/renpy-sdk.tar.bz2" | sha256sum --check
          tar -xf "$RUNNER_TEMP/renpy-sdk.tar.bz2" -C "$RUNNER_TEMP"
      - name: Resolve release version
        id: version
        run: |
          uv run --locked --extra duckdb --group renpy-linux --group assets python - <<'PY'
          import os
          from tools.prepare_game import project_version
          version = project_version()
          if os.environ["GITHUB_REF_TYPE"] == "tag" and os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Version tag must match pyproject.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY
      - name: Build and verify release artifacts
        run: uv run --locked --extra duckdb --group renpy-linux --group assets python -m tools.release build --sdk "$RUNNER_TEMP/renpy-8.5.3-sdk" --out "dist/${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: renpy-relations-${{ steps.version.outputs.version }}-candidate
          path: dist/${{ steps.version.outputs.version }}/
          compression-level: 0
          if-no-files-found: error
