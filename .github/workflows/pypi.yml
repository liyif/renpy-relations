name: Publish Python package to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

env:
  UV_VERSION: "0.11.18"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
          enable-cache: false
      - name: Install locked test dependencies
        run: uv sync --locked --extra duckdb --group renpy-linux --group assets
      - name: Check version and tag
        id: version
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          version = project["version"]
          if os.environ["GITHUB_REF_TYPE"] == "tag":
              if os.environ["GITHUB_REF_NAME"] != f"v{version}":
                  raise SystemExit("Release tag must match the version in pyproject.toml")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PY
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            git merge-base --is-ancestor HEAD origin/main
          fi
      - name: Run source and isolated installation tests
        run: uv run --no-sync pytest -q
      - name: Build wheel and source distribution
        run: uv build --no-sources --out-dir dist/pypi
      - name: Check distribution metadata and README rendering
        run: uvx --from twine==6.2.0 twine check --strict dist/pypi/*
      - name: Check imports from the exact distributions
        run: |
          for package in dist/pypi/*.whl dist/pypi/*.tar.gz; do
            uv run --isolated --no-project --with "$package" python -I -c \
              "from renpy_relations import LogicDB, RenpyLogicDB, RuleSet, RuleError"
          done
      - name: Store verified distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: pypi-distributions-${{ steps.version.outputs.version }}
          path: |
            dist/pypi/*.whl
            dist/pypi/*.tar.gz
          if-no-files-found: error
          compression-level: 0

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/renpy-relations/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pypi-distributions-${{ needs.build.outputs.version }}
          path: dist/pypi
      - name: Publish verified distributions with Trusted Publishing
        run: uv publish --trusted-publishing always dist/pypi/*.whl dist/pypi/*.tar.gz
